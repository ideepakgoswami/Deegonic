name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

# Concurrency Control: Cancel in-progress runs if new commits are pushed to the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Lint, Test, & Build
    runs-on: ubuntu-latest
    
    # Fail-Fast Strategy: If you later add a matrix (e.g., testing on multiple Node versions), 
    # fail-fast ensures the entire workflow stops immediately if one job fails.
    strategy:
      fail-fast: true
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint (Fails Fast)
        run: npm run lint

      # Fail-Fast Testing: Runs tests *before* the expensive build step.
      # If `npm run test` fails, the build step won't even execute.
      # (--if-present makes sure it doesn't fail right now if you haven't written test scripts yet)
      - name: Run Unit Tests (Fails Fast)
        run: npm run test --if-present

      - name: Run Next.js Build
        run: npm run build

  docker-build:
    name: Docker Build & Tag
    runs-on: ubuntu-latest
    needs: test-and-build # Will only run if the lint, test, and build steps above succeed
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: deegonic
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
